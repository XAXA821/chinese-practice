<style>
/* Layout: single column phone app, one task per screen, sticky step bar on top */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#17302A; --muted:#5E7069; --line:#D9E3DF;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#E2F0EB;
  --ok:#1F7A3E; --ok-soft:#E3F4E8; --bad:#B4372F; --bad-soft:#FBE7E5; --warn:#8A5A00; --warn-soft:#FFF3D6;
  --rec:#C2362C; --rec-ink:#FFFFFF;
  --f-ui:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-han:"Noto Serif TC","PingFang TC","Songti TC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A17; --surface:#16241F; --ink:#E4EEEA; --muted:#9AB0A8; --line:#2A3B35;
  --accent:#5CC2A2; --accent-ink:#06231B; --accent-soft:#1D3A31;
  --ok:#6FD38E; --ok-soft:#173826; --bad:#F08A80; --bad-soft:#3A1E1C; --warn:#F2C25B; --warn-soft:#3A2F14;
  --rec:#E5574C; --rec-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A17; --surface:#16241F; --ink:#E4EEEA; --muted:#9AB0A8; --line:#2A3B35;
  --accent:#5CC2A2; --accent-ink:#06231B; --accent-soft:#1D3A31;
  --ok:#6FD38E; --ok-soft:#173826; --bad:#F08A80; --bad-soft:#3A1E1C; --warn:#F2C25B; --warn-soft:#3A2F14;
  --rec:#E5574C; --rec-ink:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em}
.who{font-size:14px;color:var(--muted);text-align:right}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.steps span{height:5px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--accent)}
.steps span.now{background:var(--accent);opacity:.45}
.step-name{font-size:13px;color:var(--muted);margin-top:6px}

.teacher{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.teacher button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer;color:var(--warn)}
.teacher button.on{background:var(--warn);color:var(--warn-soft)}

h1{font-size:24px;line-height:1.3;margin:20px 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
label{font-size:15px;font-weight:500}
select,input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:15px;min-height:1.4em}
.note{font-size:14px;color:var(--muted)}
.count{font-size:14px;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}

.q{font-size:20px;font-weight:500;margin:4px 0 14px}
.qhan{font-family:var(--f-han);font-size:56px;font-weight:700;line-height:1.2;text-align:center;margin:6px 0 16px}
.listen-big{display:flex;justify-content:center;margin:6px 0 16px}
.listen-big button{width:88px;height:88px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:700;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:18px;cursor:pointer;color:var(--ink)}
.opt.han{font-family:var(--f-han);font-size:24px;font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:16px;font-weight:500}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;margin-bottom:8px}
.passage{font-family:var(--f-han);font-size:20px;line-height:1.9;background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.answer{border:1.5px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.tile{border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:19px;cursor:pointer;font-family:var(--f-han);font-weight:600}
.answer .tile{background:var(--accent-soft)}
.play{display:flex;gap:10px;margin-bottom:14px}
.play .btn{flex:1}

.recitem{display:flex;flex-direction:column;gap:10px}
.recitem + .recitem{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sent{font-family:var(--f-han);font-size:21px;line-height:1.7}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.recbtn{border:0;border-radius:999px;padding:10px 18px;background:var(--rec);color:var(--rec-ink);font-weight:700;cursor:pointer}
.recbtn.stop{background:var(--ink);color:var(--bg)}
.small{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.okmark{color:var(--ok);font-weight:700;font-size:15px}
audio{width:100%}
.score{font-size:44px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
table.res{width:100%;border-collapse:collapse;font-size:16px}
table.res td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.week div{text-align:center;border-radius:10px;padding:8px 2px;font-size:13px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.week b{display:block;font-size:20px;margin-top:2px}
.week .y{background:var(--ok-soft);border-color:var(--ok)} .week .y b{color:var(--ok)}
.week .n{background:var(--bad-soft);border-color:var(--bad)} .week .n b{color:var(--bad)}
@media (prefers-reduced-motion: no-preference){.panel{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);

const STEP_NAMES = ['Vocabulary','Multiple Choice','Sentence Order','Reading','Listening','Recording'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rng(seedStr){let h=2166136261;for(const c of seedStr){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dateOf(i){const [y,m,d]=CONFIG.START_DATE.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+i));return{iso:t.toISOString().slice(0,10),label:`${WD[t.getUTCDay()]} ${t.getUTCMonth()+1}/${t.getUTCDate()}`,short:`${t.getUTCMonth()+1}/${t.getUTCDate()}`}}
function dayIndexNow(){
  const shifted=new Date(Date.now()+8*3600e3-CONFIG.SWITCH_HOUR*3600e3);
  const today=Date.UTC(shifted.getUTCFullYear(),shifted.getUTCMonth(),shifted.getUTCDate());
  const [y,m,d]=CONFIG.START_DATE.split('-').map(Number);
  return Math.round((today-Date.UTC(y,m-1,d))/86400e3);
}
const PREVIEW = !CONFIG.API_URL || location.hash==='#preview';

let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate=0.85){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(voice)u.voice=voice;u.rate=rate;speechSynthesis.speak(u);
}

/* ================= 1. 生詞測驗（自動出 20 題） ================= */
function vocabQs(){
  const r=rng(S.name+'v'+S.day), d=S.day+1;
  const pool=VOCAB.filter(v=>v.d<=d), fresh=pool.filter(v=>v.d===d), old=pool.filter(v=>v.d<d);
  let pick=[];
  const review=d>4;   // 最後兩天：整課綜合複習
  if(!review){pick=shuffle(fresh,r).concat(shuffle(fresh,r));}   // 今天的新詞出現兩次
  pick=pick.concat(shuffle(review?pool:old,r)).slice(0,15);
  while(pick.length<15)pick.push(pool[Math.floor(r()*pool.length)]);
  const formats=[['h','p'],['h','e'],['a','h'],['a','e'],['a','p'],['e','h'],['p','h']];
  const used=new Set();
  return shuffle(pick,r).map((v,i)=>{
    let f;for(let k=0;k<10;k++){f=formats[Math.floor(r()*formats.length)];if(!used.has(v.h+f))break}
    used.add(v.h+f);
    const [show,ans]=f, key={h:'h',p:'p',e:'e'}[ans];
    const others=shuffle(pool.filter(o=>o.h!==v.h&&o[key]!==v[key]),r).concat(shuffle(VOCAB.filter(o=>o.d>d&&o[key]!==v[key]),r));
    const wrong=[];for(const o of others){if(!wrong.includes(o[key]))wrong.push(o[key]);if(wrong.length===3)break}
    const prompt={h:ans==='p'?'Choose the pinyin.':'Choose the meaning.',a:'Listen and choose the '+(ans==='h'?'characters':ans==='p'?'pinyin':'meaning')+'.',e:'Choose the characters.',p:'Choose the characters.'}[show];
    return{type:'mc',sec:'生詞',q:prompt,show,word:v,ans:v[key],wrong,ansKind:ans,id:'v'+i};
  });
}

/* ================= 共用：選擇題流程 ================= */
function sectionQs(step){
  const D=DAYS[S.day];
  const mc=(q,extra)=>Object.assign({type:'mc',q:q[0],ans:q[1],wrong:q.slice(2)},extra);
  if(step===1)return D.fill.map(q=>mc(q,{sec:'填空'})).concat((D.nums||[]).map(q=>({type:'mc',sec:'填空',q:'Listen and choose the number.',say:q[0],ans:q[1],wrong:q.slice(2)})));
  if(step===2)return D.order.map(o=>({type:'order',sec:'重組',o}));
  if(step===3)return D.reading.qs.map(q=>mc(q,{sec:'閱讀',passage:D.reading.text}));
  if(step===4)return D.listen.qs.map(q=>mc(q,{sec:'聽力',listen:D.listen.text}));
}
function runQuiz(step,qs){
  S.step=step;header();
  if(step>=1&&step<=2)qs=shuffle(qs,rng(S.name+'s'+step+S.day));
  let i=0;
  const next=()=>{i++;if(i<qs.length)draw();else if(step<4)runQuiz(step+1,sectionQs(step+1));else renderSpeak()};
  function draw(){
    const it=qs[i];
    let head=`<h1>${STEP_NAMES[step]}</h1><div class="count">Question ${i+1} of ${qs.length}</div>`;
    if(it.passage)head+=`<div class="passage">${esc(it.passage)}</div>`;
    if(it.listen)head+=`<div class="play"><button class="btn" id="pl" type="button">▶ Play</button><button class="btn ghost" id="pls" type="button">▶ Slow</button></div>`;
    if(it.type==='order')return drawOrder(it,head);
    let stim='';
    if(it.show==='h')stim=`<div class="qhan">${esc(it.word.h)}</div>`;
    else if(it.show==='e')stim=`<div class="q" style="text-align:center;font-size:24px">${esc(it.word.e)}</div>`;
    else if(it.show==='p')stim=`<div class="q" style="text-align:center;font-size:28px">${esc(it.word.p)}</div>`;
    else if(it.show==='a'||it.say)stim=`<div class="listen-big"><button type="button" id="sayw">🔊 Play</button></div>`;
    const opts=shuffle([it.ans,...it.wrong],rng(S.name+it.q+it.ans+i));
    const hanOpt=it.ansKind==='h';
    app.innerHTML=head+`<div class="panel"><div class="q">${esc(it.q)}</div>${stim}<div class="opts">${opts.map((o,k)=>`<button class="opt${hanOpt?' han':''}" type="button" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div></div>`;
    if(it.listen){$('#pl').onclick=()=>speak(it.listen,0.85);$('#pls').onclick=()=>speak(it.listen,0.6)}
    if(it.show==='a'){$('#sayw').onclick=()=>speak(it.word.h,0.75);speak(it.word.h,0.75)}
    if(it.say){$('#sayw').onclick=()=>speak(it.say,0.75);speak(it.say,0.75)}
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const pick=opts[+b.dataset.k],ok=pick===it.ans;
      S.results.push({sec:it.sec,q:it.word?it.word.h:(it.say||it.q),pick,ok});
      app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const v=opts[+x.dataset.k];if(v===it.ans)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
      let fb=ok?'Correct!':'Answer: '+it.ans;
      if(it.word)fb+=`　${it.word.h}・${it.word.p}・${it.word.e}`;
      if(it.say)fb+=`　（${it.say}）`;
      $('#fb').className='fb '+(ok?'ok':'bad');$('#fb').textContent=fb;
      if(it.listen&&i===qs.length-1)$('#fb').insertAdjacentHTML('afterend',`<p class="note">Transcript: ${esc(it.listen)}</p>`);
      $('#nx').innerHTML='<button class="btn" type="button" style="margin-top:14px">Next</button>';$('#nx').firstChild.onclick=next;
    });
  }
  function drawOrder(it,head){
    const o=it.o;
    const pool=shuffle(o.t.map((t,k)=>({t,k})),rng(S.name+o.t.join('')));
    let picked=[];
    function paint(){
      const left=pool.filter(p=>!picked.includes(p));
      app.innerHTML=head+`<div class="panel"><span class="tag">Grammar: ${esc(o.g)}</span><div class="q">Tap the words to make a correct sentence.</div>
      <div class="answer"><div class="tiles">${picked.map((p,k)=>`<button class="tile" data-a="${k}" type="button">${esc(p.t)}</button>`).join('')}</div></div>
      <div class="tiles">${left.map(p=>`<button class="tile" data-p="${p.k}" type="button">${esc(p.t)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div><div id="nx"><button class="btn" id="chk" type="button" style="margin-top:14px" ${left.length?'disabled':''}>Check</button></div></div>`;
      app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{picked.push(pool.find(p=>p.k===+b.dataset.p));paint()});
      app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.a,1);paint()});
      $('#chk').onclick=()=>{
        const s=picked.map(p=>p.t).join(''),ok=o.a.includes(s);
        S.results.push({sec:'重組',q:o.g,pick:s,ok});
        app.querySelectorAll('.tile').forEach(x=>x.disabled=true);
        $('#fb').className='fb '+(ok?'ok':'bad');$('#fb').textContent=ok?'Correct!':'Answer: '+o.a[0]+o.end;
        $('#nx').innerHTML='<button class="btn" type="button" style="margin-top:14px">Next</button>';$('#nx').firstChild.onclick=next;
      };
    }
    paint();
  }
  draw();
}

/* ================= 6. 錄音：朗讀 3 句＋回答 1 題 ================= */
function renderSpeak(){
  S.step=5;header();
  const sp=DAYS[S.day].speak;
  const items=sp.lines.map((l,k)=>({id:'read'+(k+1),label:`Read aloud ${k+1}`,text:l})).concat([{id:'answer',label:'Answer the question',text:sp.ask,ask:true}]);
  app.innerHTML=`<h1>Recording</h1><p class="sub">Record each item separately. You can listen and re-record. Submit opens after all four are recorded.</p>
  <div class="panel">${items.map(it=>`<div class="recitem" id="ri-${it.id}"><span class="tag">${it.label}</span><div class="sent">${it.ask?'<span class="note">Answer in Chinese:</span><br>':''}${esc(it.text)}</div><div class="rbar" id="rb-${it.id}"></div></div>`).join('')}</div>
  <div style="margin-top:16px"><button class="btn" id="send" type="button" disabled>Submit</button>${PREVIEW?'<p class="note">Teacher preview: you can submit without recording to see the results page.</p>':''}<div class="err" id="err"></div></div>`;
  let active=null;
  const canMic=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  function refresh(){$('#send').disabled=!PREVIEW&&!items.every(it=>S.recs[it.id])}
  function idle(it){
    const box=$('#rb-'+it.id),done=S.recs[it.id];
    if(done){
      box.innerHTML=`<audio controls src="${URL.createObjectURL(done)}"></audio><span class="okmark">✓ Recorded</span><button class="small" type="button" data-re>Re-record</button>`;
      box.querySelector('[data-re]').onclick=()=>{delete S.recs[it.id];refresh();idle(it)};
    }else{
      box.innerHTML=`<button class="recbtn" type="button" data-go>● Record</button><span class="timer">Not recorded yet</span>`;
      box.querySelector('[data-go]').onclick=()=>start(it);
    }
    refresh();
  }
  async function start(it){
    if(active)return;
    if(!canMic)return fallback(it);
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return fallback(it)}
    const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
    let mr;try{mr=new MediaRecorder(stream,type?{mimeType:type}:undefined)}catch(e){stream.getTracks().forEach(t=>t.stop());return fallback(it)}
    const chunks=[];active=mr;
    mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    const box=$('#rb-'+it.id);const t0=Date.now();
    box.innerHTML=`<button class="recbtn stop" type="button" data-st>■ Stop</button><span class="timer">0:00</span>`;
    const tm=box.querySelector('.timer');
    const tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);tm.textContent=`Recording ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s>=90)mr.stop()},250);
    mr.onstop=()=>{clearInterval(tick);stream.getTracks().forEach(t=>t.stop());active=null;S.recs[it.id]=new Blob(chunks,{type:mr.mimeType||'audio/webm'});idle(it)};
    box.querySelector('[data-st]').onclick=()=>mr.stop();
    mr.start();
  }
  function fallback(it){
    const box=$('#rb-'+it.id);
    box.innerHTML=`<span class="note">Recording is not available here. Record on your phone first, then choose the file:</span><input type="file" accept="audio/*" capture id="file-${it.id}" aria-label="Choose a recording">`;
    box.querySelector('input').onchange=e=>{const f=e.target.files[0];if(f){S.recs[it.id]=f;idle(it)}};
  }
  items.forEach(idle);
  $('#send').onclick=()=>submit(items);
}

function toB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)})}
async function submit(items){
  const btn=$('#send');btn.disabled=true;btn.textContent='Submitting…';
  const score=S.results.filter(r=>r.ok).length,total=S.results.length;
  if(PREVIEW){return renderDone(score,total,null)}
  try{
    const audios=[];for(const it of items){const b=S.recs[it.id];audios.push({label:it.label,b64:await toB64(b),mime:b.type||'audio/mpeg'})}
    const body=JSON.stringify({name:S.name,date:dateOf(S.day).iso,lesson:CONFIG.LESSON,score,total,results:S.results,audios});
    const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'error');
    renderDone(score,total,j.dates||[dateOf(S.day).iso]);
  }catch(e){
    btn.disabled=false;btn.textContent='Try again';
    $('#err').textContent='Not sent. Check your internet connection and try again.';
  }
}

/* ================= 完成＋本週繳交紀錄 ================= */
function weekHTML(dates){
  const done=new Set(dates||[]);const today=S.day;let n=0;
  const cells=DAYS.map((_,i)=>{const d=dateOf(i);const y=done.has(d.iso);if(y)n++;
    const cls=y?'y':(i<today||(i===today&&false))?'n':'';const mark=y?'1':i<today?'0':'–';
    return`<div class="${cls}">${d.short}<b>${mark}</b></div>`}).join('');
  const past=Math.min(today+1,DAYS.length);
  return`<h2 style="font-size:18px;margin:18px 0 0">This week</h2><p class="note" style="margin:4px 0 0">1 = submitted, 0 = missed. So far: ${n} submitted, ${past-n} missed.</p><div class="week">${cells}</div>`;
}
function renderDone(score,total,dates){
  S.step=6;header();
  const secs=['生詞','填空','重組','閱讀','聽力'].map(s=>{const rs=S.results.filter(r=>r.sec===s);return`<tr><td>${{生詞:'Vocabulary',填空:'Multiple Choice',重組:'Sentence Order',閱讀:'Reading',聽力:'Listening'}[s]}</td><td>${rs.filter(r=>r.ok).length} / ${rs.length}</td></tr>`}).join('');
  const preview=dates===null;
  if(preview){dates=[];for(let i=0;i<=S.day;i++)if(i!==1)dates.push(dateOf(i).iso)}
  app.innerHTML=`<h1>Done for today!</h1><div class="panel"><div class="score">${score} / ${total}</div>
  <table class="res">${secs}<tr><td>Recording</td><td>4 submitted</td></tr></table>
  ${weekHTML(dates)}
  ${preview?'<p class="note">Teacher preview: this week’s record is sample data (day 2 marked as missed). Nothing was submitted.</p>':''}
  <p class="note">New practice opens tomorrow at ${CONFIG.SWITCH_HOUR}:00 a.m. See you tomorrow.</p></div>`;
}

/* ================= 開始 ================= */
(function boot(){
  const idx=dayIndexNow();
  if(PREVIEW){S.day=Math.min(Math.max(idx,0),DAYS.length-1);teacherBar();renderLogin();return}
  if(idx<0){S.day=0;header();app.innerHTML=`<h1>Practice has not started yet</h1><div class="panel"><p>The first day is ${dateOf(0).label} at ${CONFIG.SWITCH_HOUR}:00 a.m.</p></div>`;return}
  if(idx>=DAYS.length){S.day=DAYS.length-1;header();app.innerHTML=`<h1>This lesson’s practice has ended</h1><div class="panel"><p>Your teacher will share the next lesson soon.</p></div>`;return}
  S.day=idx;renderLogin();
})();
</script>
